name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'npm'
      - name: Use npm 12
        run: npm install -g npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Update praylight deps
        run: npx playwright install

      - name: Run format check
        run: npm run format-check

      - name: Run lint check
        run: npm run lint-check

      - name: Run tests
        run: npm run test
